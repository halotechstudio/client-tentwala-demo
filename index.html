<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tentwala Simulation</title>
<meta name="description" content="Live simulation of Tentwala: customer app, vendor app and admin dashboard for booking tent houses in Rajasthan.">
<meta property="og:title" content="Tentwala · live demo of all three apps">
<meta property="og:description" content="Book a tent house end to end: customer app, vendor app and admin dashboard, with escrow, delivery OTP and return count.">
<meta property="og:image" content="https://halotechstudio.github.io/client-tentwala-demo/preview.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: dark showroom page; three devices on one scaled canvas (phone · phone · browser), guided stepper above, message log below. */
:root{
  color-scheme:light;
  --page:#0F0D0C;--page-2:#191614;--page-3:#24201D;--page-line:#332E2A;--page-text:#EEEAE5;--page-muted:#A59F98;
  --bg:#F6F4F1;--surface:#FFFFFF;--sunken:#F0EDE9;--line:#E7E2DB;--line-2:#D6CFC5;
  --ink:#1C1917;--ink-2:#3F3A36;--muted:#6B645D;--faint:#948C83;
  --brand:#8A1C2B;--brand-600:#721523;--brand-50:#FBF2F3;--brand-100:#F2D9DC;
  --gold:#A86412;--gold-50:#FDF5E8;
  --teal:#0E5E59;--teal-700:#0A4642;--teal-900:#08302D;--teal-50:#E9F3F2;--teal-100:#CFE5E2;
  --ok:#157F3B;--ok-50:#EAF6EE;--warn:#A85A07;--warn-50:#FEF4E6;--bad:#B42318;--bad-50:#FDEEEC;--info:#1E4FD0;--info-50:#EDF2FE;--violet:#6234C9;--violet-50:#F2EDFD;
  --c-cust:#E2A33B;--c-vend:#3BB5A9;--c-adm:#A895F5;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:20px;
  --sh-1:0 1px 2px rgba(28,25,23,.05),0 1px 1px rgba(28,25,23,.03);
  --sh-2:0 6px 16px rgba(28,25,23,.08),0 1px 3px rgba(28,25,23,.05);
  --sh-3:0 16px 40px rgba(28,25,23,.18);
  --font:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hi:'Noto Sans Devanagari','Plus Jakarta Sans',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(1200px 600px at 50% -10%,#2A211C 0%,transparent 60%),var(--page)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;touch-action:manipulation}
input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
.i{flex:none;display:inline-block;vertical-align:middle}
.i.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.hi{font-family:var(--hi)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ---------- showroom chrome ---------- */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:20px max(24px,env(safe-area-inset-left,0px)) 14px;color:var(--page-text)}
.logo{display:flex;align-items:center;gap:12px}
.logo-mk{width:40px;height:40px;border-radius:12px;background:var(--brand);display:grid;place-items:center;color:#fff}
.logo b{font-size:20px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.logo span{font-size:13px;color:var(--page-muted)}
.top .sp{flex:1}
.tbtn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--page-line);color:var(--page-text);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .15s}
.tbtn:hover{background:var(--page-3)}
.tbtn.pri{background:#F3EEE8;color:var(--ink);border-color:#F3EEE8}
.tbtn.pri:hover{background:#fff}
.tbtn:disabled{opacity:.45;cursor:default}
.guide{margin:0 max(24px,env(safe-area-inset-left,0px)) 8px;background:var(--page-2);border:1px solid var(--page-line);border-radius:16px;color:var(--page-text);overflow:hidden}
.gsteps{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));border-bottom:1px solid var(--page-line)}
.gs{padding:12px 10px 10px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--page-line);position:relative;min-width:0;text-align:left}
.gs:last-child{border-right:0}
.gs .n{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted)}
.gs .n i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.gs .t{font-size:13px;font-weight:600;line-height:1.3;color:var(--page-muted)}
.gs.done .t{color:var(--page-text)}
.gs.done .n:after{content:"Done";margin-left:auto;color:#7FD3A0;letter-spacing:.04em}
.gs.cur{background:var(--page-3)}
.gs.cur:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.gs.cur .t{color:#fff}
.gnow{display:flex;align-items:center;gap:16px;padding:14px 18px;flex-wrap:wrap}
.gnow .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--page-3);display:inline-flex;align-items:center;gap:6px;flex:none}
.gnow .who i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.gnow p{flex:1;min-width:260px;font-size:15px;line-height:1.5;color:#DCD6CF}
.gnow p b{color:#fff;font-weight:700}
.gnow .acts{display:flex;gap:8px}
#wrap{position:relative}
#canvas{width:1720px;transform-origin:top left;display:flex;gap:28px;padding:18px 24px 0;align-items:flex-start}
#canvas.stack{width:890px;flex-direction:column;align-items:center}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.lbl{display:flex;align-items:center;gap:10px;color:var(--page-text);font-size:14px;font-weight:700}
.lbl i{width:8px;height:8px;border-radius:50%}
.lbl span{font-weight:500;color:var(--page-muted)}
.col.glow .phone,.col.glow .browser{box-shadow:0 0 0 3px var(--gc),0 30px 80px rgba(0,0,0,.55)}
.phone{width:384px;height:800px;border-radius:54px;background:#050505;padding:10px;box-shadow:0 0 0 1px #2E2A27,0 30px 80px rgba(0,0,0,.55);position:relative;transition:box-shadow .3s var(--ease)}
.phone:before{content:"";position:absolute;top:20px;left:50%;transform:translateX(-50%);width:100px;height:28px;border-radius:16px;background:#000;z-index:40}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:14px;font-weight:700;color:var(--ink);background:var(--sbg,var(--surface))}
.sbar.dark{color:#fff}
.sbar .sic{display:flex;gap:5px;align-items:center}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:0}
.feedbar{margin:22px max(24px,env(safe-area-inset-left,0px)) 36px;background:var(--page-2);border:1px solid var(--page-line);border-radius:16px;padding:16px 18px;color:var(--page-text)}
.feedbar h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px}
.fl div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:13.5px;line-height:1.45;padding:6px 0;border-bottom:1px solid var(--page-line)}
.fl .to{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;color:var(--page-muted)}
.fl .to i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fl em{font-style:normal;color:var(--page-muted);font-size:12px;white-space:nowrap}
.fl .ch{color:var(--page-muted)}

/* ---------- shared app components ---------- */
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px}
.sbw{justify-content:space-between}
.stack8{display:flex;flex-direction:column;gap:8px}
.stack12{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-1)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.card-h b{font-size:15px;font-weight:700}
.card-h span{font-size:13px;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 12px}
.sec-h h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 16px;border-radius:var(--r);font-weight:700;font-size:15px;background:var(--brand);color:#fff;transition:background .15s,transform .1s}
.btn:hover{background:var(--brand-600)}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--sunken)}
.btn.tonal{background:var(--brand-50);color:var(--brand)}
.btn.tonal:hover{background:var(--brand-100)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid #F1C9C4}
.btn.light{background:rgba(255,255,255,.16);color:#fff}
.btn.sm{min-height:40px;font-size:14px;border-radius:10px;padding:0 12px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;transition:background .15s}
.ib:hover{background:var(--sunken)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--pb);color:var(--pc)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-req{--pb:var(--warn-50);--pc:var(--warn)}.s-acc{--pb:var(--info-50);--pc:var(--info)}.s-conf{--pb:var(--ok-50);--pc:var(--ok)}
.s-disp{--pb:var(--teal-50);--pc:var(--teal)}.s-del{--pb:var(--violet-50);--pc:var(--violet)}.s-ret{--pb:var(--warn-50);--pc:var(--warn)}
.s-set{--pb:var(--ok);--pc:#fff}.s-x{--pb:var(--sunken);--pc:var(--muted)}.s-pend{--pb:var(--warn-50);--pc:var(--warn)}.s-live{--pb:var(--ok-50);--pc:var(--ok)}
.rate{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink)}
.rate .i{color:#D99A12}
.rate span{color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 12px;min-height:56px;justify-content:center}
.field .l{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.field input,.field select{border:0;background:transparent;font-size:15px;font-weight:700;color:var(--ink);outline:none;width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:700}
.stepper button{width:28px;height:28px;border-radius:8px;background:var(--sunken);display:grid;place-items:center;color:var(--ink)}
.qty{display:inline-flex;align-items:center;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700}
.qty button{width:34px;height:36px;display:grid;place-items:center;color:#fff}
.qty span{min-width:30px;text-align:center;font-size:14px}
.add{height:36px;padding:0 16px;border-radius:10px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:14px;background:var(--surface);display:inline-flex;align-items:center;gap:4px}
.add:disabled{border-color:var(--line-2);color:var(--faint)}
.subhdr{display:flex;align-items:center;gap:12px;padding:4px 16px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.subhdr .t{flex:1;min-width:0}
.subhdr .t b{display:block;font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subhdr .t span{font-size:13px;color:var(--muted)}
.ctabar{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px 26px;display:flex;gap:12px;align-items:center}
.ctabar .sum{flex:1;font-size:12px;color:var(--muted);line-height:1.3}
.ctabar .sum b{display:block;font-size:19px;color:var(--ink);font-weight:800}
.ctabar .btn{width:auto;padding:0 20px}
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 24px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--faint);position:relative;padding-top:8px;min-height:48px}
.tabbar button.on{color:var(--brand)}
.tabbar button.on:before{content:"";position:absolute;top:-6px;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.tabbar .bdg{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
.toast{position:absolute;top:52px;left:10px;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;z-index:30;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh-3);animation:drop .3s var(--ease);font-size:13.5px;line-height:1.4;color:var(--ink)}
.toast .ti{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.toast .tt{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
@keyframes drop{from{transform:translateY(-16px);opacity:0}to{transform:none;opacity:1}}
.bill{font-size:14px;display:flex;flex-direction:column;gap:8px}
.bill .r{display:flex;justify-content:space-between;gap:12px}
.bill .r span:first-child{color:var(--ink-2)}
.bill .r.t{border-top:1px dashed var(--line-2);padding-top:12px;margin-top:4px;font-weight:800;font-size:16px}
.bill .r.t span:first-child{color:var(--ink)}
.bill .r.sub{font-size:13px}
.bill .r.sub span{color:var(--muted)!important}
.bill .r.g span{color:var(--ok)!important;font-weight:600}
.trust{display:flex;gap:12px;align-items:flex-start;background:var(--ok-50);border-radius:var(--r);padding:12px 14px;font-size:13px;line-height:1.5;color:#14532D}
.trust .i{color:var(--ok);margin-top:2px}
.trust b{font-weight:700}
.list .li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0;padding-bottom:0}
.list .li:first-child{padding-top:0}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--sunken);flex:none}
.li .nm{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.35}
.li .nm small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.li .v{font-size:14px;font-weight:700}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:14px 1fr;gap:10px;font-size:13px;line-height:1.45;padding-bottom:12px;position:relative}
.tl div:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:5px;box-shadow:0 0 0 3px var(--brand-50)}
.tl div:after{content:"";position:absolute;left:4px;top:16px;bottom:0;width:1px;background:var(--line-2)}
.tl div:last-child:after{display:none}
.tl em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.acard{border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line)}
.acard .ah{display:flex;gap:12px;align-items:flex-start}
.acard .aic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--tc)}
.acard h3{font-size:16px;font-weight:700;line-height:1.3}
.acard p{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:2px}
.acard.hero{background:var(--brand);border-color:var(--brand);color:#fff}
.acard.hero p{color:rgba(255,255,255,.85)}
.acard.hero .aic{background:rgba(255,255,255,.16);color:#fff}
.t-ok{--tb:var(--ok-50);--tc:var(--ok)}.t-warn{--tb:var(--warn-50);--tc:var(--warn)}.t-info{--tb:var(--info-50);--tc:var(--info)}.t-teal{--tb:var(--teal-50);--tc:var(--teal)}.t-bad{--tb:var(--bad-50);--tc:var(--bad)}.t-v{--tb:var(--violet-50);--tc:var(--violet)}
.progress .pt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:10px}
.progress .pt b{color:var(--ink);font-size:15px}
.pbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pbar i{height:6px;border-radius:3px;background:var(--line)}
.pbar i.d{background:var(--ok)}
.pbar i.c{background:var(--brand)}
.plabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px;font-weight:600}
.otp{display:flex;gap:8px;justify-content:center}
.otp span{width:52px;height:60px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-size:30px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.sheet{position:absolute;inset:0;background:rgba(15,13,12,.5);z-index:25;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet .in{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 20px 32px;animation:up .28s var(--ease)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.upis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.upi{border:1px solid var(--line-2);border-radius:var(--r);height:56px;padding:0 12px;font-weight:700;display:flex;align-items:center;gap:10px;font-size:14px;transition:background .15s}
.upi:hover{background:var(--sunken)}
.upi i{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--sunken);color:var(--ink-2)}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:24px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.stars{display:flex;gap:6px;justify-content:center;margin-top:8px}
.stars button{color:var(--line-2);width:40px;height:40px;display:grid;place-items:center}
.stars button.on{color:#D99A12}
.empty{text-align:center;padding:48px 24px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px}
.empty .ei{width:56px;height:56px;border-radius:16px;background:var(--sunken);display:grid;place-items:center;color:var(--faint);margin-bottom:4px}
.empty b{color:var(--ink);font-size:16px}
.rowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:background .15s}
.rowcard:hover{background:#FCFBFA}
.rowcard .ttl{font-size:15px;font-weight:700;line-height:1.3}
.rowcard .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{height:0}
.tabs button{flex:none;height:44px;padding:0 10px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}

/* ---------- customer ---------- */
.c-top{background:var(--surface);padding:4px 16px 16px;border-bottom:1px solid var(--line)}
.loc{display:flex;flex-direction:column;gap:2px}
.loc .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px}
.loc .v{display:flex;align-items:center;gap:2px;font-weight:800;font-size:16px}
.loc select{border:0;background:transparent;font-weight:800;font-size:16px;appearance:none;cursor:pointer;outline:none}
.greet{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:16px;line-height:1.2}
.greet-sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.search{margin-top:16px;height:48px;background:var(--sunken);border-radius:var(--r);padding:0 14px;font-size:14px;display:flex;gap:10px;align-items:center;color:var(--faint)}
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.evb{border:1px solid var(--line);border-radius:var(--r);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface);transition:all .15s;line-height:1.2;text-align:center}
.evb .i{color:var(--muted)}
.evb small{font-size:11.5px;font-weight:500;color:var(--faint);font-family:var(--hi)}
.evb.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.evb.on .i{color:var(--brand)}
.promo{position:relative;border-radius:var(--r-lg);overflow:hidden;margin-top:16px;min-height:150px;display:flex;align-items:flex-end;color:#fff}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.promo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,5,.05) 0%,rgba(20,10,5,.8) 100%)}
.promo div{position:relative;z-index:1;padding:16px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.promo b{display:block;font-size:19px;font-weight:800;margin:4px 0;line-height:1.25}
.promo span.d{font-size:13px;opacity:.88;line-height:1.45;display:block}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;box-shadow:var(--sh-1);transition:box-shadow .2s,transform .2s}
.vcard:hover{box-shadow:var(--sh-2)}
.vcover{position:relative;aspect-ratio:16/8.5;background:var(--sunken)}
.vcover img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:12px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.badge.ver{left:12px;background:rgba(255,255,255,.95);color:var(--ok)}
.badge.new{right:12px;background:var(--ink);color:#fff}
.vbody{padding:14px 16px 16px}
.vbody h3{font-size:16.5px;font-weight:700;line-height:1.3}
.vbody .hn{font-size:13px;color:var(--muted);font-family:var(--hi)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:10px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.vfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.from{font-size:12.5px;color:var(--muted)}
.from b{font-size:17px;color:var(--ink);font-weight:800;margin:0 2px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.hscroll::-webkit-scrollbar{height:0}
.mini{flex:none;width:136px;cursor:pointer}
.mini img{width:136px;height:136px;border-radius:var(--r);object-fit:cover;background:var(--sunken)}
.mini b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;margin-top:8px}
.mini .p{font-size:13.5px;font-weight:800;margin-top:2px}
.mini .p span{font-weight:500;color:var(--muted);font-size:12px}
.cover{position:relative;height:230px;flex:none;background:var(--sunken)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%)}
.fab{position:absolute;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;z-index:2;box-shadow:var(--sh-2);color:var(--ink)}
.fab.l{left:16px}.fab.r{right:16px}
.sheetbody{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-24px;position:relative;padding:20px 16px 16px}
.t1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.facts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin:16px 0}
.facts div{padding:12px;text-align:center;border-right:1px solid var(--line)}
.facts div:last-child{border:0}
.facts b{display:block;font-size:16px;font-weight:800}
.facts span{font-size:12px;color:var(--muted)}
.estimate{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--gold-50);border:1px solid #F1DDB8;border-radius:var(--r-lg);padding:14px;margin-bottom:12px;transition:background .15s}
.estimate:hover{background:#FBEFD9}
.estimate .ei{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--gold);display:grid;place-items:center;flex:none}
.estimate b{display:block;font-size:15px;font-weight:700}
.estimate span{font-size:12.5px;color:var(--muted)}
.prow{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.pimg{width:76px;height:76px;border-radius:var(--r);object-fit:cover;background:var(--sunken);flex:none}
.pinfo{flex:1;min-width:0;line-height:1.35}
.pinfo b{display:block;font-size:14.5px;font-weight:700}
.pinfo .hn{font-size:12.5px;color:var(--muted);font-family:var(--hi)}
.price{font-weight:800;font-size:15px;margin-top:4px}
.price small{font-size:12px;color:var(--muted);font-weight:500}
.avail{font-size:12px;color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:5px;margin-top:2px}
.avail:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.avail.low{color:var(--warn)}
.avail.out{color:var(--bad)}
.sched{display:flex;flex-direction:column;gap:0;margin-top:4px}
.sched div{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sched div:last-child{border:0}
.sched .n{width:28px;height:28px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-2)}
.sched .on .n{background:var(--brand);color:#fff}
.sched small{display:block;color:var(--muted);font-size:12px}
.sched b{font-size:15px;font-weight:800}

/* ---------- vendor (teal theme) ---------- */
.vapp{--brand:var(--teal);--brand-600:var(--teal-700);--brand-50:var(--teal-50);--brand-100:var(--teal-100)}
.v-top{background:var(--teal-900);color:#fff;padding:4px 16px 20px}
.v-top select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;font-size:13px;font-weight:600;height:36px;padding:0 10px;max-width:220px;outline:none}
.v-top select option{color:#000}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#9BE3C1;background:rgba(155,227,193,.12);height:28px;padding:0 10px;border-radius:999px}
.online:before{content:"";width:7px;height:7px;border-radius:50%;background:#58D39A}
.v-top h1{font-size:22px;font-weight:800;margin-top:16px;letter-spacing:-.01em;line-height:1.25}
.v-top p{font-size:13.5px;color:rgba(255,255,255,.7);margin-top:2px}
.vstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.vstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:10px 12px}
.vstat span{font-size:12px;color:rgba(255,255,255,.7);display:flex;align-items:center;gap:6px}
.vstat b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-2)}
.req .hd{display:flex;gap:12px;align-items:center}
.av{width:40px;height:40px;border-radius:50%;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.req .nm{flex:1;min-width:0}
.req .nm b{display:block;font-size:15px}
.req .nm span{font-size:12.5px;color:var(--muted)}
.req .amt{font-size:17px;font-weight:800}
.req .ln{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:8px;background:var(--sunken);font-size:12px;font-weight:600;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:center;padding:6px 0;font-size:11px;color:var(--muted);line-height:1.2;font-weight:600}
.day b{display:block;font-size:15px;color:var(--ink);font-weight:800}
.day.pk{border-color:#E9C98F;background:var(--gold-50)}
.day.bk{background:var(--teal);border-color:var(--teal);color:rgba(255,255,255,.8)}
.day.bk b{color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);border:1px solid var(--b,transparent)}
.ob-top{background:var(--teal-900);color:#fff;padding:8px 20px 24px}
.ob-top .mk{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.ob-top h1{font-size:24px;font-weight:800;margin-top:16px;line-height:1.2}
.ob-top p{font-size:14px;color:rgba(255,255,255,.72);margin-top:4px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.perks div{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.08);border-radius:10px;padding:10px}
.perks .i{color:#9BE3C1}
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-h .n{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
.step-h b{font-size:15px}
.step-h span{font-size:12.5px;color:var(--muted);font-family:var(--hi)}
.vfield{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.vfield label{font-size:12px;font-weight:600;color:var(--muted)}
.vfield input,.vfield select{height:44px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:15px;font-weight:600;background:var(--surface);outline:none;width:100%}
.vfield input:focus,.vfield select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50)}
.docs-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc{min-height:48px;border:1px dashed var(--line-2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink-2)}
.doc.ok{border-style:solid;border-color:#A7D9BC;background:var(--ok-50);color:#14532D}
.doc.ok .i{color:var(--ok)}
.chk{display:flex;gap:6px;flex-wrap:wrap}
.chk button{height:36px;border:1px solid var(--line-2);border-radius:999px;padding:0 12px 0 4px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.chk button img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.chk button.on{border-color:var(--teal);background:var(--teal-50);color:var(--teal-700)}
.otpin input{width:100%;height:64px;font-size:30px;letter-spacing:18px;text-align:center;border:1px solid var(--line-2);border-radius:var(--r);font-weight:800;outline:none;font-variant-numeric:tabular-nums;background:var(--surface)}
.otpin input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50)}
.wallet{background:var(--teal-900);color:#fff;border-radius:var(--r-xl);padding:18px}
.wallet .k{font-size:13px;color:rgba(255,255,255,.7)}
.wallet .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.w3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.w3 div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;font-size:12px;color:rgba(255,255,255,.7)}
.w3 b{display:block;font-size:14.5px;color:#fff;margin-top:2px}
.btn.gold{background:#F3E2C0;color:#3E2A07}
.btn.gold:hover{background:#F7EAD0}
.pinput{width:72px;height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 8px;font-weight:700;font-size:14px;outline:none}
.tgl{width:40px;height:24px;border-radius:12px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .2s var(--ease)}
.tgl.on{background:var(--teal)}
.tgl.on:after{transform:translateX(16px)}

/* ---------- admin ---------- */
.browser{width:840px;height:800px;border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px #2E2A27,0 30px 80px rgba(0,0,0,.55);transition:box-shadow .3s var(--ease)}
.chrome{flex:none;height:40px;background:#ECE8E3;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line-2)}
.chrome i{width:11px;height:11px;border-radius:50%;display:block}
.chrome .url{margin-left:16px;background:var(--surface);border-radius:8px;height:26px;padding:0 12px;font-size:12.5px;color:var(--muted);flex:1;max-width:340px;display:flex;align-items:center;gap:6px}
.adm{flex:1;display:flex;min-height:0;position:relative;background:var(--bg)}
.side{width:188px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.side .brand .mk{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center}
.side .brand b{font-size:15px;font-weight:800;display:block;line-height:1.1}
.side .brand span{font-size:11.5px;color:var(--muted)}
.side .grp{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;padding:12px 8px 6px}
.side button{text-align:left;height:38px;padding:0 10px;border-radius:9px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.side button .i{color:var(--faint)}
.side button:hover{background:var(--sunken)}
.side button.on{background:var(--brand-50);color:var(--brand)}
.side button.on .i{color:var(--brand)}
.side button em{font-style:normal;margin-left:auto;background:var(--brand);color:#fff;border-radius:9px;font-size:11px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 6px 0;border-top:1px solid var(--line);font-size:12.5px}
.side .me .av{width:32px;height:32px;font-size:12px;background:var(--brand-50);color:var(--brand)}
.side .me b{display:block;font-size:13px}
.side .me span{color:var(--muted)}
.amain{flex:1;overflow-y:auto;padding:20px 22px;min-width:0}
.amain::-webkit-scrollbar{width:8px}.amain::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.ahead h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.ahead p{font-size:13px;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;transition:background .6s}
.kpi .kh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .kh .ki{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:600;color:var(--ok);margin-top:2px;display:flex;align-items:center;gap:4px}
.kpi .d.n{color:var(--muted)}
.kpi.flash{background:#FFF8E8}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;min-width:0}
.panel h2{font-size:14.5px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{color:var(--muted);font-weight:500;font-size:12.5px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.chart{position:relative;height:170px;margin:8px 0 0 30px}
.chart .grid{position:absolute;inset:0 0 22px 0;display:flex;flex-direction:column;justify-content:space-between}
.chart .grid div{border-top:1px dashed var(--line);position:relative;height:0}
.chart .grid div span{position:absolute;left:-30px;top:-8px;font-size:11px;color:var(--faint);width:24px;text-align:right}
.chart .bars{position:absolute;inset:0 0 0 0;display:flex;align-items:flex-end;gap:8px;padding-bottom:22px}
.chart .cb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.chart .cb div{width:100%;max-width:28px;border-radius:5px 5px 0 0;background:#E6D6C7;position:relative}
.chart .cb.pk div{background:#C9A487}
.chart .cb.cur div{background:var(--brand)}
.chart .cb .val{position:absolute;top:-18px;font-size:11px;font-weight:700;color:var(--brand);white-space:nowrap}
.chart .cb span.m{position:absolute;bottom:-20px;font-size:11px;color:var(--muted)}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:0 8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:#FBFAF8}
.tbl td .s{display:block;font-size:12px;color:var(--muted)}
.tbl .r{text-align:right}
.ab{height:32px;padding:0 12px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ab.g{background:var(--ok)}.ab.o{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}.ab.r{background:var(--surface);border:1px solid #F1C9C4;color:var(--bad)}
.att{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.att:last-child{border:0}
.att .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--tb);color:var(--tc)}
.att div{flex:1;min-width:0}
.act{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);line-height:1.45}
.act:last-child{border:0}
.act em{font-style:normal;color:var(--muted);font-size:12px}
.act b{font-weight:700}
.drawer{position:absolute;top:0;right:0;bottom:0;width:400px;background:var(--surface);box-shadow:-16px 0 40px rgba(28,25,23,.14);padding:20px;overflow-y:auto;z-index:5;animation:sl .25s var(--ease);border-left:1px solid var(--line)}
@keyframes sl{from{transform:translateX(100%)}to{transform:none}}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:4px 0 10px;gap:2px}
.leg{display:flex;flex-direction:column;gap:6px;font-size:13px}
.leg div{display:flex;justify-content:space-between}
.leg span{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.leg span:before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.setg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setg label{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.setg input{height:42px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;font-size:15px;font-weight:700;color:var(--ink);outline:none}
.setg input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50)}
.setg .help{font-weight:500;font-size:12px;color:var(--faint)}
.docs{display:flex;gap:4px;flex-wrap:wrap;width:176px}
.tbl td.vn{min-width:180px}
.panel.tw{overflow-x:auto}
.docs span{font-size:11px;height:22px;padding:0 7px;border-radius:6px;background:var(--ok-50);color:var(--ok);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.docs span.no{background:var(--bad-50);color:var(--bad)}
.vthumb{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.atoast{position:absolute;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:9;animation:drop .25s var(--ease);max-width:340px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh-3)}
.atoast .i{color:#7FD3A0}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.chips2 span{height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--sunken);color:var(--muted)}
.chips2 span.on{background:var(--ok-50);color:var(--ok)}
.policy{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.5}
.policy div{display:grid;grid-template-columns:20px 1fr;gap:8px}
.policy .i{color:var(--muted);margin-top:2px}

/* ---------- money modal ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,7,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade .2s}
.modal .in{background:var(--surface);border-radius:20px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:28px;color:var(--ink)}
.modal h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.modal .lead{color:var(--muted);font-size:14.5px;line-height:1.55;margin-top:6px;max-width:62ch}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.flow div{border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.flow .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;margin-bottom:10px}
.flow b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.modal table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.modal td,.modal th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
.modal th{font-size:12px;color:var(--muted);font-weight:600}
.example{margin-top:16px;background:var(--sunken);border-radius:var(--r);padding:14px 16px;font-size:14px;line-height:1.55}
body.solo{background:#E9E5E0}
body.solo .top,body.solo .guide,body.solo .feedbar,body.solo .lbl{display:none}
body.solo #canvas{transform:none!important;width:auto;padding:20px;justify-content:center}
body.solo #wrap{height:auto!important}
body.solo-c #col-v,body.solo-c #col-a,body.solo-v #col-c,body.solo-v #col-a,body.solo-a #col-c,body.solo-a #col-v{display:none}
body.solo .phone,body.solo .browser{box-shadow:0 0 0 1px #2E2A27,0 12px 30px rgba(0,0,0,.18)}
@media (max-width:999px){.gsteps{grid-template-columns:repeat(4,minmax(0,1fr))}.gs:nth-child(4n){border-right:0}.gs{border-bottom:1px solid var(--page-line)}.fl{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.gsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.gs:nth-child(2n){border-right:0}.top{padding-left:16px;padding-right:16px}.guide,.feedbar{margin-left:16px;margin-right:16px}.flow{grid-template-columns:1fr}.top .sp{display:none}}

function mkProducts(vid,mult,skip=[]){
  TPL.forEach((t,i)=>{ if(skip.includes(t[0]))return;
    const price=t[5]>=100?Math.round(t[5]*mult/50)*50:Math.max(1,Math.round(t[5]*mult));
    S.products.push({id:vid+'-'+t[0],vid,key:t[0],cat:t[1],name:t[2],hi:t[3],unit:t[4],price,stock:Math.round(t[6]*(0.7+((i*7+vid.length*3)%6)/10)),replace:t[7],active:true});
  });
}
function autoItems(vid,G,type){
  const has=k=>S.products.find(p=>p.vid===vid&&p.key===k&&p.active);
  const want={
    maha:G>=300?Math.ceil(G/500):0, hang:G<300?1:0,
    chair:type==='jagran'?Math.round(G*0.2/10)*10:Math.round(G*0.6/10)*10,
    gadda:type==='jagran'||type==='katha'?Math.round(G*0.5/10)*10:0,
    table:['wedding','bhoj','bday','corp'].includes(type)?Math.ceil(G*0.35/6):0,
    thali:['wedding','bhoj','jagran'].includes(type)?Math.round(G/10)*10:0,
    degchi:['wedding','bhoj','jagran'].includes(type)?Math.ceil(G/100):0,
    light:Math.ceil(G/20), cooler:Math.ceil(G/70), carpet:Math.ceil(G/12),
    stage:['wedding','jagran','corp','bday'].includes(type)?1:0, mandap:type==='wedding'?1:0,
    gate:['wedding','corp'].includes(type)?1:0, sofa:type==='wedding'?2:0,
    dj:['wedding','jagran','bday'].includes(type)?1:0, gen:G>=250?1:0};
  const out={};
  Object.entries(want).forEach(([k,q])=>{ const p=has(k); if(p&&q>0) out[p.id]=Math.min(q,p.stock); });
  if(!Object.keys(out).some(id=>P(id).cat==='tent')){ const t=S.products.find(p=>p.vid===vid&&p.cat==='tent'); if(t) out[t.id]=1; }
  return out;
}
function quote(vid,items,days){
  const v=Vd(vid), st=S.settings;
  const subtotal=Object.entries(items).reduce((s,[pid,q])=>s+P(pid).price*q,0)*days;
  const delivery=v.delivery, itemsTotal=subtotal+delivery, fee=st.fee;
  const advance=Math.round(itemsTotal*st.adv/100), deposit=Math.round(subtotal*st.dep/100), commission=Math.round(subtotal*st.comm/100);
  return {subtotal,delivery,itemsTotal,fee,advance,deposit,commission,balance:itemsTotal-advance,payNow:advance+deposit+fee,grand:itemsTotal+fee,comm:st.comm,adv:st.adv,dep:st.dep,days};
}
function booked(pid,date,days,exclude){
  let n=0; const e=addDays(date,days-1);
  S.bookings.forEach(b=>{ if(b.id===exclude||!HOLD.includes(b.status))return;
    const be=addDays(b.event.date,b.event.days-1);
    if(b.event.date<=e&&date<=be){ const it=b.items.find(i=>i.pid===pid); if(it) n+=it.qty; }});
  return n;
}
const avail=(p,date,days,ex)=>p.stock-booked(p.id,date,days,ex);

function payAdvance(b,app){
  b.status='confirmed'; b.paidVia=app; tick(9);
  tl(b,`Advance ${inr(b.q.advance)}, deposit ${inr(b.q.deposit)} and fee ${inr(b.q.fee)} paid via ${app} into Tentwala escrow.`);
  led(b,'Customer advance, deposit and fee into escrow',b.q.payNow,b.q.payNow);
  feed('v','WhatsApp',`${b.id} confirmed. ${inr(b.q.advance)} advance is held in escrow. Deliver on ${fd(addDays(b.event.date,-1))}.`);
  feed('c','SMS',`Payment of ${inr(b.q.payNow)} received. Booking ${b.id} confirmed.`,false);
  feed('a','Event',`${b.id} confirmed, ${inr(b.q.payNow)} into escrow`,false);
  flashAdmin(); render(); glow('v');
}
function deliver(b){
  const v=Vd(b.vid); b.status='delivered'; tick(55);
  const rel=b.q.advance-b.q.commission;
  tl(b,'Delivered. OTP verified at the venue and item count matched.');
  led(b,`Advance released to ${v.name} after ${b.q.comm}% commission`,rel,-rel,'vendor');
  led(b,'Platform commission and customer fee earned',b.q.commission+b.q.fee,-(b.q.commission+b.q.fee),'rev');
  v.wallet.avail+=rel; S.rev+=b.q.commission+b.q.fee;
  feed('v','Push',`OTP verified. ${inr(rel)} added to your wallet. Payout to your bank tomorrow morning.`);
  feed('c','WhatsApp',`Items delivered for ${b.id}. Wishing you a wonderful function.`);
  S.ui.v.otp=''; flashAdmin(); render(); glow('c');
}
function settle(b,mode){
  const v=Vd(b.vid), dep=b.q.deposit, fromDep=Math.min(b.shortage,dep), extra=b.shortage-fromDep, bal=b.q.balance+extra;
  b.balPaid=bal; b.payMode=mode; b.refund=dep-fromDep; b.fromDep=fromDep; tick(20);
  if(mode==='upi'){led(b,'Balance via UPI to vendor wallet',bal,0,'vendor');v.wallet.avail+=bal}
  else{led(b,'Balance paid to vendor in cash (recorded)',bal,0,'cash');v.wallet.cash+=bal}
  if(fromDep){led(b,'Missing items: deposit to vendor',fromDep,-fromDep,'vendor');v.wallet.avail+=fromDep}
  if(b.refund)led(b,'Deposit refund to customer UPI',b.refund,-b.refund,'refund');
  b.status='settled'; tl(b,`Settled. Balance ${inr(bal)} by ${mode==='upi'?'UPI':'cash'}, deposit refund ${inr(b.refund)}.`);
  feed('c','SMS',`${b.id} closed. ${inr(b.refund)} deposit refunded to your UPI. Please rate ${v.name}.`);
  feed('v','WhatsApp',`${b.id} settled. ${mode==='upi'?inr(bal)+' added to wallet':'Cash '+inr(bal)+' recorded'}${fromDep?', plus '+inr(fromDep)+' for missing items':''}.`);
  flashAdmin(); render(); glow('v');
}
function payout(v,amt,how){
  v.wallet.paid+=amt; v.wallet.avail=0; const utr='UTR'+Math.floor(1e9+Math.random()*9e9);
  v.payouts.unshift({amt,how,utr,t:clockStr()}); led(null,`Payout to ${v.name}, bank ••4521 (${how})`,amt,0,'payout');
  feed('v','SMS',`${inr(amt)} sent to your bank account ••4521. Ref ${utr}.`); toast('a',`Paid ${inr(amt)} to ${v.name}`);
}
function cancelBooking(b){
  const v=Vd(b.vid);
  if(b.status==='requested'||b.status==='accepted'){b.status='cancelled';tl(b,'Cancelled by customer before payment.');feed('v','Push',`${b.id} was cancelled before payment.`);render();return}
  const left=daysBetween(clockDate(),b.event.date); tick(5);
  if(left>=7){ const ref=b.q.advance+b.q.deposit; led(b,'Cancellation 7+ days out: refund minus fee',ref,-ref,'refund'); led(b,'Fee retained',b.q.fee,-b.q.fee,'rev'); S.rev+=b.q.fee;
    tl(b,`Cancelled ${left} days before. Refund ${inr(ref)}.`);feed('c','SMS',`${b.id} cancelled. ${inr(ref)} refund within 2 working days.`);}
  else{ const vs=Math.round(b.q.advance/2), ref=b.q.advance-vs+b.q.deposit; led(b,'Late cancellation: 50% advance to vendor',vs,-vs,'vendor'); v.wallet.avail+=vs;
    led(b,'Refund to customer',ref,-ref,'refund'); led(b,'Fee retained',b.q.fee,-b.q.fee,'rev'); S.rev+=b.q.fee;
    tl(b,`Late cancellation (${left} days). Vendor keeps ${inr(vs)}, refund ${inr(ref)}.`);feed('c','SMS',`${b.id} cancelled. ${inr(ref)} refunded.`);}
  b.status='cancelled'; feed('v','WhatsApp',`${b.id} was cancelled by the customer. Stock released.`); render();
}

function rv(){

  if(!ui.vid) body=vOnboard();

  else if(top.s==='orders') body=vOrders();
  else if(top.s==='order'){const r=vOrder(top.id);body=r[0];bar=r[1];sb=sbar()}
  else if(top.s==='return'){const r=vReturn(top.id);body=r[0];bar=r[1];sb=sbar()}

  else if(top.s==='earn') body=vEarn();

  const navH=nav?`<nav class="tabbar">${[['home','home','Home'],['orders','list','Orders'],['stock','stock','Stock'],['earn','wallet','Earnings']].map(([k,i,l])=>`<button class="${ui.tab===k?'on':''}" data-a="vTab|${k}">${ic(i,22)}${l}${k==='orders'&&nNew?`<span class="bdg">${nNew}</span>`:''}</button>`).join('')}</nav>`:'';

}

  run:async()=>{ const b=demoB(); goC([{s:'bookings'},{s:'booking',id:b.id}],'bookings'); render(); await sleep(1300); H.cSettle(b.id,'upi'); await sleep(1300); H.cRate(b.id,5); }},
 {t:'Admin pays out',w:'a',h:'Admin sees every rupee: escrow back to zero, revenue booked, and the <b>T+1 payout</b> to the vendor\'s bank with a reference number.',
  run:async()=>{ S.ui.a.view='money'; render(); await sleep(1200); const b=demoB(); H.aPayout(b.vid); goV([{s:'earn'}],'earn'); render(); }},
];
const WHO={c:['Customer','var(--c-cust)'],v:['Vendor','var(--c-vend)'],a:['Admin','var(--c-adm)']};
async function runStep(){const i=S.demo.i; if(i>=STEPS.length)return; const st=STEPS[i]; glow(st.w); await st.run(); S.demo.i=i+1; render()}
function rGuide(){
  const i=S.demo.i, st=STEPS[i], run=S.demo.running;
  $('#guide').innerHTML=`<div class="gsteps">${STEPS.map((s,j)=>`<div class="gs ${j<i?'done':j===i?'cur':''}" style="--c:${WHO[s.w][1]}"><span class="n"><i></i>${j+1} · ${WHO[s.w][0]}</span><span class="t">${s.t}</span></div>`).join('')}</div>
   <div class="gnow">${st?`<span class="who" style="--c:${WHO[st.w][1]}"><i></i>Step ${i+1} · ${WHO[st.w][0]}</span><p>${st.h}</p>`:`<span class="who" style="--c:#7FD3A0"><i></i>Complete</span><p><b>That's the full journey.</b> Reset to run it again, or explore other paths: cancel a booking, tap "Count is wrong" to raise a dispute, change the commission in Admin → Settings, or switch vendors.</p>`}
   <div class="acts"><button class="tbtn" data-a="gNext" ${run||!st?'disabled':''}>Next step${ic('right',16)}</button><button class="tbtn pri" data-a="gAuto" ${!st&&!run?'disabled':''}>${ic(run?'pause':'play',16)}${run?'Pause':'Auto-play'}</button></div></div>`;
}
function rFeed(){
  $('#feed').innerHTML=S.feed.slice(0,8).map(x=>`<div><span class="to" style="--c:${WHO[x.to][1]}"><i></i>${WHO[x.to][0]}</span><span><span class="ch">${x.ch} · </span>${x.msg}</span><em>${x.t}</em></div>`).join('')||'<div style="grid-template-columns:1fr;border:0;color:var(--page-muted)">Messages to customers and vendors appear here as the demo runs.</div>';
}
function modelHtml(){
  const q=quote('v3',{'v3-chair':400,'v3-maha':1},1); const s=S.settings;
  return `<div class="modal" data-a="gCloseModal"><div class="in" data-a="noop" role="dialog" aria-label="How money flows"><div class="row sbw" style="align-items:flex-start"><div><h2>How money flows</h2><p class="lead">Customers pay an advance into escrow. Vendors are paid when they hand over the goods. Tentwala takes its share from the advance, so cash balances never leak revenue.</p></div><button class="ib" data-a="gCloseModal" aria-label="Close">${ic('x',18)}</button></div>
   <div class="flow"><div><span class="n">1</span><b>Vendor accepts</b>Stock is confirmed before anyone pays, so a double-booked vendor never causes a refund.</div><div><span class="n">2</span><b>Advance into escrow</b>${s.adv}% advance, ${s.dep}% refundable deposit and the ₹${s.fee} fee.</div><div><span class="n">3</span><b>Delivery OTP</b>The advance minus ${s.comm}% commission goes to the vendor. Tentwala books its revenue.</div><div><span class="n">4</span><b>Return and settle</b>Balance by UPI or cash. Missing items come out of the deposit, the rest is refunded.</div></div>
   <table><thead><tr><th>Revenue stream</th><th>Now</th><th>Typical range</th></tr></thead><tbody>
   <tr><td>Commission on rental (vendor side)</td><td>${s.comm}%</td><td>6–10%</td></tr><tr><td>Customer booking fee</td><td>₹${s.fee}</td><td>₹49–149</td></tr>
   <tr><td>Vendor Pro subscription</td><td>₹999 / month</td><td>about 20% of vendors</td></tr><tr><td>Instant payout fee</td><td>${s.instant}%</td><td>optional</td></tr>
   <tr><td>Damage protection add-on, replaces deposit</td><td>Phase 2</td><td>about 2% of order</td></tr><tr><td>Vendor working-capital loans via partner NBFC</td><td>Phase 3</td><td>referral fee</td></tr></tbody></table>
   <div class="example num"><b>Worked example.</b> 400 chairs and one Maharaja pandal from Rajputana Shamiyana: rental ${inr(q.subtotal)}. Tentwala earns ${inr(q.commission)} + ${inr(q.fee)} = <b>${inr(q.commission+q.fee)}</b>, and the vendor nets ${inr(q.itemsTotal-q.commission)}.</div></div></div>`;
}

/* ============ RENDER ============ */
function paint(id,r){
  const el=$('#'+id); const sc=el.querySelector('.scroll,.amain'); const prev=sc?sc.scrollTop:0; const same=el.dataset.k===r.key;
  const ae=document.activeElement, keep=ae&&el.contains(ae)&&ae.dataset&&ae.dataset.in?ae.dataset.in:null;
  el.innerHTML=r.html; el.dataset.k=r.key; const ns=el.querySelector('.scroll,.amain'); if(ns&&same) ns.scrollTop=prev;
  if(keep){const n=el.querySelector(`[data-in="${keep}"]`); if(n){n.focus();const L=n.value.length;try{n.setSelectionRange(L,L)}catch(e){}}}
}
function render(){paint('cust',rc());paint('vend',rv());paint('adm',ra());rGuide();rFeed()}
function fit(){const c=$('#canvas'),w=$('#wrap');const narrow=window.innerWidth<1000;c.classList.toggle('stack',narrow);
  const sc=narrow?Math.min(1,(window.innerWidth-8)/890):Math.min(1.15,(window.innerWidth)/1720);c.style.transform=`scale(${sc})`;w.style.height=(c.offsetHeight*sc)+'px'}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const [fn,...args]=el.dataset.a.split('|');if(fn==='noop'){e.stopPropagation();return}if(H[fn]){e.stopPropagation();H[fn](...args)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='otpbox'){const top=S.ui.v.stack.at(-1);H.vOtp(top.id)}
  if(e.key==='Escape'&&$('#modal').innerHTML)H.gCloseModal()});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&IN[k])IN[k](e.target.value)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ch;if(k&&CH[k])CH[k](e.target.value,e.target)});
window.addEventListener('resize',fit);
$('#logoMk').innerHTML=ic('tent',22); $('#manualBtn').innerHTML=ic('file',16)+'Manual (PDF)'; $('#moneyBtn').innerHTML=ic('rupee',16)+'How money flows'; $('#resetBtn').innerHTML=ic('reset',16)+'Reset';
$('#url').innerHTML=ic('lock',12)+'admin.tentwala.in'; $('#feedH').innerHTML=ic('msg',14)+'WhatsApp, SMS and push messages sent by the platform';
seed();render();fit();
/* Deep links: ?step=N fast-forwards N guided steps; ?solo=c|v|a shows one device only (used for manual screenshots);
   &cs / &vs / &av override the screen shown (e.g. cs=vendor, vs=stock, av=bookings). */
if(SOLO){document.body.classList.add('solo','solo-'+SOLO)}
(async()=>{
  const n=Math.min(+QS.get('step')||0,STEPS.length);
  for(let k=0;k<n;k++){await runStep()}
  const b=demoB();
  const cs=QS.get('cs'); if(cs){ if(cs==='vendor')goC([{s:'home'},{s:'vendor',id:QS.get('vid')||S.ui.v.vid||'v3'}]); else if(cs==='booking'&&b)goC([{s:'bookings'},{s:'booking',id:b.id}],'bookings'); else if(cs==='pay'&&b){goC([{s:'bookings'},{s:'booking',id:b.id}],'bookings');S.ui.c.pay={id:b.id,proc:false}} else goC([{s:cs}],cs); }
  const vs=QS.get('vs'); if(vs){ if(vs==='order'&&b)goV([{s:'home'},{s:'order',id:b.id}],'home'); else if(vs==='return'&&b){goV([{s:'home'},{s:'order',id:b.id}],'home');H.vRetOpen(b.id);const ch=b.items.find(i=>P(i.pid).key==='chair');if(ch)S.ui.v.ret[ch.pid]=ch.qty-6} else goV([{s:vs}],vs); }
  const av=QS.get('av'); if(av){S.ui.a.view=av; if(QS.has('sel')&&b)S.ui.a.sel=b.id}
  if(QS.has('modal'))H.gModel();
  render(); document.body.dataset.ready='1';
})();
</script>
